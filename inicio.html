<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes</title>
        <style>
             * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f172a;
            /* Azul bem escuro moderno */
            color: #f8fafc;
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid #1e293b;
        }

        h1 {
            color: #38bdf8;
            /* Azul claro de destaque */
            font-size: 2.5rem;
        }

        nav a {
            color: #f8fafc;
            text-decoration: none;
            margin-left: 15px;
            font-weight: bold;
            transition: color 0.2s;
            margin-left: none;
            text-align: center;
        }

        nav a:hover {
            color: #38bdf8;
        }

        h2.title {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        /* Container da galeria de filmes */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        /* Card individual do filme */
        .movie-card {
            background-color: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: contain;
            background-color: #020617;
            display: block;
            object-fit: cover;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));

        }

        .movie-card h3 {
            font-size: 1.1rem;
            margin-top: 12px;
            padding: 0 10px;
            color: #e2e8f0;
        }

        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: contain;
            background-color: #020617;
            display: block;
        }
        </style>
</head>

<body>

            <div class="movie-card">

            </div>

            <article class="movie-card">

        <div class="movies-grid ">

    </div>
